name: NOIR Panel iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: xcode-27

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          set -e
          xcodegen generate

      - name: Build NOIRPanel
        run: |
          set -o pipefail
          xcodebuild \
            -project NOIRPanel.xcodeproj \
            -scheme NOIRPanel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/noir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          mkdir -p artifacts/Payload
          cp -R build/noir/Build/Products/Release-iphoneos/NOIRPanel.app artifacts/Payload/
          cd artifacts
          zip -qry "$GITHUB_WORKSPACE/NOIRPanel.ipa" Payload

      - name: Upload NOIRPanel IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOIRPanel-IPA
          path: NOIRPanel.ipa
          if-no-files-found: error
