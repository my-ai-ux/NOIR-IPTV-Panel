name: NOIRPanel
options:
  bundleIdPrefix: com.noir
targets:
  NOIRPanel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.noir.iptvpanel
        TARGETED_DEVICE_FAMILY: "1"
        SDKROOT: iphoneos
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
